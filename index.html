<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Parts Compatibility</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.pm{font-family:'Public Sans',system-ui,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased}
.pm *{box-sizing:border-box}
.pm button,.pm input,.pm textarea{font-family:inherit}
.pm button{cursor:pointer}
.mm{font-family:'IBM Plex Mono',ui-monospace,monospace}
.btn{min-height:48px;border-radius:12px;border:1px solid #0057B8;background:#0057B8;color:#fff;font-weight:600;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:#fff;color:#0057B8}
.btn.dng{background:#B42318;border-color:#B42318}
.btn:disabled{background:#E2E8F0;border-color:#E2E8F0;color:#64748B;cursor:not-allowed}
.btn:active{filter:brightness(.92)}
.card{background:#fff;border:1px solid #D9E0EA;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.2}
.chip.unv{background:#FFF4DB;color:#7A4100;border:1px solid #F0C36B}
.chip.rst{background:#FFE6D1;color:#7F2E00;border:1px solid #F2A66B}
.chip.rev{background:#EDF1F6;color:#2B3748;border:1px solid #B8C4D4}
.chip.off{background:#EDF1F6;color:#2B3748;border:1px solid #B8C4D4}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#0F172A;flex:none}
.ib:active{background:#E6EBF2}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;background:#fff;border:0;border-bottom:1px solid #E5EAF1;width:100%;text-align:left;font-size:15px;color:#0F172A}
.row:active{background:#EEF3FA}
.sw{position:relative;width:48px;height:28px;border-radius:999px;border:0;flex:none}
.sw i{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .12s}
.lab{font-size:12px;font-weight:600;color:#5B6778;letter-spacing:.04em;text-transform:uppercase;padding:16px 16px 6px}
.pm button:focus-visible,.pm input:focus-visible,.pm textarea:focus-visible{outline:3px solid #7FB0F0;outline-offset:2px}
.swrap{display:flex;align-items:center;gap:8px;height:52px;padding:0 4px 0 14px;border-radius:14px;background:#fff;border:1.5px solid #B8C4D4}
.swrap:focus-within{border-color:#0057B8;box-shadow:0 0 0 3px rgba(0,87,184,.2)}
.swrap input{flex:1;min-width:0;height:48px;border:0;outline:0 !important;background:transparent;font-size:16px;color:#0F172A}
.fld{width:100%;border-radius:12px;border:1.5px solid #B8C4D4;background:#fff;font-size:15px;padding:12px;color:#0F172A}
.fld:focus{border-color:#0057B8}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #D5E3F5;border-top-color:#0057B8;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.mini{font-size:13px;color:#5B6778;line-height:1.45}
</style>

<style>
html,body{margin:0;height:100%;background:#DDE3EB}
body{display:flex;align-items:center;justify-content:center}
#app{display:contents}
@media (min-width:431px){#app .pm{border-radius:28px;box-shadow:0 20px 60px rgba(15,23,42,.25);border:1px solid #C3CCD8}}
@media (max-width:430px){body{display:block;background:#F4F6F9}#app .pm{width:100vw !important;height:100vh !important;height:100dvh !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="pm" style="position:relative;width:390px;height:844px;overflow:hidden;background:#F4F6F9;display:flex;flex-direction:column">

<!-- Launch -->
<sc-if value="{{showSplash}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff">
<div style="width:68px;height:68px;border-radius:18px;background:#0057B8;display:flex;align-items:center;justify-content:center;color:#fff">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"></rect><path d="M10.5 18.5h3"></path><path d="M10 7.5l2 2 3.2-3.2"></path></svg>
</div>
<div style="font-size:22px;font-weight:700">Parts Compatibility</div>
<div class="mini" style="display:flex;align-items:center;gap:8px"><span class="spin"></span>Loading local data</div>
</div>
</sc-if>

<sc-if value="{{booted}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column;position:relative">

<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div style="background:#EDF1F6;border-bottom:1px solid #B8C4D4;padding:7px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#2B3748;flex:none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"></path><circle cx="12" cy="19.5" r="1"></circle><path d="M3 3l18 18"></path></svg>
Offline. Using downloaded data.
</div>
</sc-if>

<!-- ============ HOME ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:14px 16px 12px;background:#fff;border-bottom:1px solid #E5EAF1;flex:none">
<div style="display:flex;align-items:center;justify-content:space-between;min-height:32px">
<div style="display:flex;align-items:center;gap:8px">
<div style="width:28px;height:28px;border-radius:8px;background:#0057B8;color:#fff;display:flex;align-items:center;justify-content:center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"></rect><path d="M10 7.5l2 2 3.2-3.2"></path></svg>
</div>
<span style="font-weight:700;font-size:15px;color:#0057B8">Parts Compatibility</span>
</div>
<sc-if value="{{updAvail}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{toUpdate}}" aria-label="Dataset update available. Open update screen" style="min-height:36px;border-radius:999px;border:1px solid #0057B8;background:#E6F0FB;color:#0057B8;font-weight:600;font-size:12px;padding:0 12px">Update available</button>
</sc-if>
</div>
<h1 style="margin:8px 0 12px;font-size:22px;line-height:1.2;font-weight:700">Find Compatible Displays</h1>
<div class="swrap">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="text" ref="{{inputRef}}" aria-label="Search phone model or brand" placeholder="Search phone model or brand" value="{{query}}" onChange="{{onQuery}}" autocomplete="off" autocapitalize="none" spellcheck="false">
<sc-if value="{{hasQuery}}" hint-placeholder-val="{{ false }}">
<button type="button" class="ib" onClick="{{clearQuery}}" aria-label="Clear search text"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-if>
</div>
</div>

<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px">

<sc-if value="{{qEmpty}}" hint-placeholder-val="{{ true }}">
<div>
<div style="font-size:15px;color:#334155;margin-bottom:12px">Search a phone to find compatible displays</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<button type="button" onClick="{{toFavs}}" class="card" style="min-height:76px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#0F172A">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0057B8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"></path></svg>Favorites</button>
<button type="button" onClick="{{toHist}}" class="card" style="min-height:76px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#0F172A">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0057B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Recent</button>
<button type="button" onClick="{{toUpdate}}" class="card" style="min-height:76px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#0F172A">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0057B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"></path></svg>Updates</button>
</div>

<div class="lab" style="padding-left:0">Recent searches</div>
<sc-if value="{{hasRecent}}" hint-placeholder-val="{{ true }}">
<div class="card" style="overflow:hidden">
<sc-for list="{{recents}}" as="r" hint-placeholder-count="2">
<button type="button" class="row" onClick="{{r.open}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#5B6778">{{r.brand}}</span><span style="display:block;font-weight:600;overflow-wrap:anywhere">{{r.name}}</span></span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noRecent}}" hint-placeholder-val="{{ false }}">
<div class="mini">No recent searches yet. They stay on this device.</div>
</sc-if>

<div style="margin-top:18px;border:1.5px dashed #B8C4D4;border-radius:14px;padding:12px">
<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#5B6778">PROTOTYPE ONLY · TRY A SEARCH</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
<sc-for list="{{hints}}" as="h" hint-placeholder-count="4">
<button type="button" onClick="{{h.pick}}" style="min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #B8C4D4;background:#fff;font-size:14px;font-weight:600;color:#0057B8">{{h.label}}</button>
</sc-for>
</div>
<div class="mini" style="margin-top:8px">Real dataset: 88 groups, 449 models. All records are unverified.</div>
</div>
</div>
</sc-if>

<sc-if value="{{qShort}}" hint-placeholder-val="{{ false }}">
<div class="mini" style="padding:8px 2px">Keep typing. Suggestions appear after two characters.</div>
</sc-if>

<sc-if value="{{hasMatches}}" hint-placeholder-val="{{ false }}">
<div>
<div class="card" style="overflow:hidden">
<sc-for list="{{sugg}}" as="m" hint-placeholder-count="3">
<sc-if value="{{m.hasHeader}}" hint-placeholder-val="{{ false }}"><div style="padding:9px 16px 6px;font-size:13px;font-weight:700;color:#334155;background:#F4F6F9;border-bottom:1px solid #E5EAF1">{{m.header}}</div></sc-if>
<button type="button" class="row" onClick="{{m.open}}" aria-label="{{m.aria}}">
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#5B6778">{{m.brand}}</span><span style="display:block;font-size:16px;overflow-wrap:anywhere"><span>{{m.pre}}</span><b style="background:#DCEAFB;color:#003A7A">{{m.mid}}</b><span>{{m.post}}</span></span></span>
<span style="font-size:12px;font-weight:600;color:{{m.tagColor}};text-align:right;flex:none">{{m.tag}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</div>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn sec" style="width:100%;margin-top:10px" onClick="{{showAllFn}}">Show all {{matchCount}} matches</button></sc-if>
</div>
</sc-if>

<sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}">
<div>
<sc-if value="{{hasFuzzy}}" hint-placeholder-val="{{ false }}">
<div style="margin-bottom:14px">
<div style="font-size:14px;font-weight:600;color:#334155;margin:0 2px 8px">Closest names. None match exactly.</div>
<div class="card" style="overflow:hidden">
<sc-for list="{{fz}}" as="m" hint-placeholder-count="2">
<button type="button" class="row" onClick="{{m.open}}" aria-label="{{m.aria}}">
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#5B6778">{{m.brand}}</span><span style="display:block;font-size:16px;overflow-wrap:anywhere">{{m.name}}</span></span>
<span style="font-size:12px;font-weight:600;color:#004A99;flex:none">{{m.tag}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
<div class="card" style="padding:20px 16px;text-align:center">
<div style="font-size:17px;font-weight:700">No matching models found.</div>
<div class="mini" style="margin-top:6px">Check the spelling or try fewer words. Missing a model? You can report it.</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
<button type="button" class="btn" onClick="{{editSearch}}">Edit search</button>
<button type="button" class="btn sec" onClick="{{clearQuery}}">Clear search</button>
<button type="button" class="btn sec" onClick="{{reportMissingModel}}">Report a missing model</button>
</div>
</div>
</div>
</sc-if>

</div>
</div>
</sc-if>

<!-- ============ RESULTS ============ -->
<sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:8px 8px 10px;background:#fff;border-bottom:1px solid #E5EAF1;display:flex;align-items:center;gap:4px;flex:none">
<button type="button" class="ib" onClick="{{goBack}}" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex:1;min-width:0">
<div style="font-size:12px;color:#5B6778">{{model.brand}}</div>
<div style="font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere">{{model.name}}</div>
</div>
<button type="button" class="ib" onClick="{{favModelToggle}}" aria-label="{{favModelLabel}}" aria-pressed="{{favModelOn}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{favModelFill}}" stroke="{{favModelStroke}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"></path></svg></button>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px">
<sc-if value="{{hasGroups}}" hint-placeholder-val="{{ true }}">
<div>
<h2 style="font-size:16px;margin:0 0 4px;font-weight:700">Compatible display models</h2>
<div class="mini" style="margin-bottom:12px">{{groupCountLabel}}</div>
<sc-for list="{{gcards}}" as="g" hint-placeholder-count="2">
<div class="card" style="padding:14px;margin-bottom:12px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<span style="font-size:13px;font-weight:600;color:#334155">Display / LCD</span>
<span class="mm" style="font-size:12px;color:#5B6778">{{g.ref}}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
<sc-if value="{{g.isUnv}}" hint-placeholder-val="{{ true }}"><span class="chip unv">Unverified</span></sc-if>
<sc-if value="{{g.isReview}}" hint-placeholder-val="{{ false }}"><span class="chip rev">Needs review</span></sc-if>
<sc-if value="{{g.hasRestr}}" hint-placeholder-val="{{ false }}"><span class="chip rst">Restricted: {{g.restr}}</span></sc-if>
</div>
<div style="font-size:15px;margin-top:10px;font-weight:600">{{g.count}} models in this group</div>
<div class="mini" style="margin-top:2px;overflow-wrap:anywhere">{{g.preview}}</div>
<sc-if value="{{g.hasRestr}}" hint-placeholder-val="{{ false }}">
<div style="margin-top:10px;background:#FFF4DB;border:1px solid #F0C36B;border-radius:10px;padding:8px 10px;font-size:13px;color:#7A4100;font-weight:600">Source note: {{g.restrNote}}</div>
</sc-if>
<sc-if value="{{g.isReview}}" hint-placeholder-val="{{ false }}">
<div style="margin-top:10px;background:#EDF1F6;border:1px solid #B8C4D4;border-radius:10px;padding:8px 10px;font-size:13px;color:#2B3748;font-weight:600">{{g.reviewText}}</div>
</sc-if>
<button type="button" class="btn" style="width:100%;margin-top:12px" onClick="{{g.open}}">View all {{g.count}} models</button>
</div>
</sc-for>
<div class="mini">Models are listed together in the source data. This is not confirmation that parts are physically interchangeable.</div>
<button type="button" class="btn sec" style="width:100%;margin-top:14px" onClick="{{reportFromResults}}">Report incorrect or missing info</button>
</div>
</sc-if>
<sc-if value="{{noGroups}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding:20px 16px;text-align:center">
<div style="font-size:17px;font-weight:700">No compatibility group is available for this model yet.</div>
<div class="mini" style="margin-top:6px">This model is in our database, but no compatibility group is available yet. That does not mean no replacement exists in the real world.</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
<button type="button" class="btn" onClick="{{searchAnother}}">Search another model</button>
<button type="button" class="btn sec" onClick="{{reportMissingGroup}}">Report missing compatibility info</button>
</div>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- ============ GROUP ============ -->
<sc-if value="{{isGroup}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:8px 8px 10px;background:#fff;border-bottom:1px solid #E5EAF1;display:flex;align-items:center;gap:4px;flex:none">
<button type="button" class="ib" onClick="{{goBack}}" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex:1;min-width:0;font-size:18px;font-weight:700">Compatibility group</div>
<button type="button" class="ib" onClick="{{favGroupToggle}}" aria-label="{{favGroupLabel}}" aria-pressed="{{favGroupOn}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{favGroupFill}}" stroke="{{favGroupStroke}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"></path></svg></button>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px">
<div class="card" style="padding:14px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<span class="mm" style="font-size:14px">{{group.ref}}</span>
<span style="font-size:13px;font-weight:600;color:#334155">Display / LCD</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
<sc-if value="{{group.isUnv}}" hint-placeholder-val="{{ true }}"><span class="chip unv">Unverified</span></sc-if>
<sc-if value="{{group.isReview}}" hint-placeholder-val="{{ false }}"><span class="chip rev">Needs review</span></sc-if>
<sc-if value="{{group.hasRestr}}" hint-placeholder-val="{{ false }}"><span class="chip rst">Restricted: {{group.restr}}</span></sc-if>
</div>
<sc-if value="{{group.hasRestr}}" hint-placeholder-val="{{ false }}">
<div style="margin-top:10px;background:#FFF4DB;border:1px solid #F0C36B;border-radius:10px;padding:8px 10px;font-size:13px;color:#7A4100;font-weight:600">Source note: {{group.restrNote}}</div>
</sc-if>
<sc-if value="{{group.isReview}}" hint-placeholder-val="{{ false }}">
<div style="margin-top:10px;background:#EDF1F6;border:1px solid #B8C4D4;border-radius:10px;padding:8px 10px;font-size:13px;color:#2B3748;font-weight:600">{{group.reviewText}}</div>
</sc-if>
<div class="mini" style="margin-top:10px">This listing comes from a supplied source list and has not been independently confirmed. Check the part before you rely on it.</div>
<div class="mini" style="margin-top:6px">Dataset {{dsVer}} · {{group.sid}}</div>
</div>

<sc-if value="{{hasCurrent}}" hint-placeholder-val="{{ true }}">
<div class="lab" style="padding-left:0">You searched</div>
<div style="background:#E6F0FB;border:1.5px solid #0057B8;border-radius:14px;padding:12px 14px">
<div style="font-size:12px;color:#334155">{{current.brand}}</div>
<div style="font-size:17px;font-weight:700;overflow-wrap:anywhere">{{current.name}}</div>
</div>
</sc-if>

<div class="lab" style="padding-left:0">Listed in the same compatibility group ({{othersLabel}})</div>
<sc-if value="{{showGroupSearch}}" hint-placeholder-val="{{ false }}">
<div class="swrap" style="height:48px;margin-bottom:10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="text" aria-label="Search within this group" placeholder="Search within this group" value="{{gq}}" onChange="{{onGq}}" autocomplete="off" autocapitalize="none" spellcheck="false" style="font-size:15px">
<sc-if value="{{gq}}" hint-placeholder-val="{{ false }}"><button type="button" class="ib" onClick="{{clearGq}}" aria-label="Clear group search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
</div>
</sc-if>
<sc-if value="{{gqNone}}" hint-placeholder-val="{{ false }}"><div class="mini" style="padding:6px 2px">No model in this group matches your search.</div></sc-if>
<div class="card" style="overflow:hidden">
<sc-for list="{{others}}" as="o" hint-placeholder-count="3">
<sc-if value="{{o.incomplete}}" hint-placeholder-val="{{ false }}"><div style="padding:12px 16px;background:#F4F6F9;border-bottom:1px solid #E5EAF1"><span class="chip rev">Incomplete entry</span><div class="mini" style="margin-top:4px">The source list has "{{o.name}}" with no model name. It can't be searched.</div></div></sc-if>
<sc-if value="{{o.normal}}" hint-placeholder-val="{{ true }}">
<button type="button" class="row" onClick="{{o.open}}">
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#5B6778">{{o.brand}}</span><span style="display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere">{{o.name}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-if>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px">
<button type="button" class="btn sec" onClick="{{copyGroup}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 012-2h9"></path></svg>Copy summary</button>
<button type="button" class="btn sec" onClick="{{reportFromGroup}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>Report issue</button>
</div>
<div class="mini" style="margin-top:8px">The copied summary keeps the verification status and any restriction.</div>
</div>
</div>
</sc-if>

<!-- ============ FAVORITES ============ -->
<sc-if value="{{isFavs}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:16px 16px 12px;background:#fff;border-bottom:1px solid #E5EAF1;flex:none">
<h1 style="margin:0 0 10px;font-size:22px;font-weight:700">Favorites</h1>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#EDF1F6;border-radius:12px;padding:4px">
<button type="button" onClick="{{favTabModels}}" aria-pressed="{{favTabIsModels}}" style="min-height:44px;border-radius:9px;border:0;font-weight:600;font-size:14px;background:{{ftm.bg}};color:{{ftm.color}}">Models ({{favModelCount}})</button>
<button type="button" onClick="{{favTabGroups}}" aria-pressed="{{favTabIsGroups}}" style="min-height:44px;border-radius:9px;border:0;font-weight:600;font-size:14px;background:{{ftg.bg}};color:{{ftg.color}}">Groups ({{favGroupCount}})</button>
</div>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px">
<sc-if value="{{showFavModels}}" hint-placeholder-val="{{ true }}">
<div>
<sc-if value="{{hasFavModels}}" hint-placeholder-val="{{ true }}">
<div class="card" style="overflow:hidden">
<sc-for list="{{favModels}}" as="f" hint-placeholder-count="2">
<div style="display:flex;align-items:center;border-bottom:1px solid #E5EAF1;background:#fff">
<button type="button" class="row" style="border-bottom:0;flex:1;min-width:0" onClick="{{f.open}}">
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#5B6778">{{f.brand}}</span><span style="display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere">{{f.name}}</span><span style="display:block;font-size:12px;color:#5B6778;margin-top:2px">{{f.tag}}</span></span>
</button>
<button type="button" class="ib" style="margin-right:6px" onClick="{{f.remove}}" aria-label="{{f.removeLabel}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#0057B8" stroke="#0057B8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"></path></svg></button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noFavModels}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding:24px 16px;text-align:center">
<div style="font-size:17px;font-weight:700">No favorite models yet</div>
<div class="mini" style="margin-top:6px">Tap the star on a model to keep it here, even offline.</div>
<button type="button" class="btn" style="margin-top:16px" onClick="{{toHomeSearch}}">Search models</button>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{showFavGroups}}" hint-placeholder-val="{{ false }}">
<div>
<sc-if value="{{hasFavGroups}}" hint-placeholder-val="{{ false }}">
<div class="card" style="overflow:hidden">
<sc-for list="{{favGroups}}" as="f" hint-placeholder-count="1">
<div style="display:flex;align-items:center;border-bottom:1px solid #E5EAF1;background:#fff">
<button type="button" class="row" style="border-bottom:0;flex:1;min-width:0" onClick="{{f.open}}">
<span style="flex:1;min-width:0"><span class="mm" style="display:block;font-size:14px">{{f.ref}}</span><span style="display:block;font-size:13px;color:#334155;margin-top:2px">Display / LCD · {{f.count}} models</span><span style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><span class="chip unv">{{f.statusLabel}}</span><sc-if value="{{f.hasRestr}}" hint-placeholder-val="{{ false }}"><span class="chip rst">{{f.restr}}</span></sc-if></span></span>
</button>
<button type="button" class="ib" style="margin-right:6px" onClick="{{f.remove}}" aria-label="{{f.removeLabel}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#0057B8" stroke="#0057B8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"></path></svg></button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noFavGroups}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding:24px 16px;text-align:center">
<div style="font-size:17px;font-weight:700">No favorite groups yet</div>
<div class="mini" style="margin-top:6px">Open a compatibility group and tap the star to save it.</div>
<button type="button" class="btn" style="margin-top:16px" onClick="{{toHomeSearch}}">Search models</button>
</div>
</sc-if>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- ============ HISTORY ============ -->
<sc-if value="{{isHist}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:16px 8px 12px 16px;background:#fff;border-bottom:1px solid #E5EAF1;flex:none;display:flex;align-items:center;justify-content:space-between">
<h1 style="margin:0;font-size:22px;font-weight:700">Search history</h1>
<sc-if value="{{hasHist}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{askClear}}" style="min-height:44px;padding:0 12px;border:0;background:transparent;color:#B42318;font-weight:600;font-size:14px">Clear all</button>
</sc-if>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px">
<sc-if value="{{hasHist}}" hint-placeholder-val="{{ true }}">
<div>
<div class="mini" style="margin-bottom:8px">Stored on this device only.</div>
<div class="card" style="overflow:hidden">
<sc-for list="{{histItems}}" as="h" hint-placeholder-count="3">
<div style="display:flex;align-items:center;border-bottom:1px solid #E5EAF1;background:#fff">
<button type="button" class="row" style="border-bottom:0;flex:1;min-width:0" onClick="{{h.open}}" aria-label="{{h.aria}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="flex:1;min-width:0"><span style="display:block;font-size:12px;color:#5B6778">{{h.brand}}</span><span style="display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere">{{h.name}}</span></span>
</button>
<button type="button" class="ib" style="margin-right:6px" onClick="{{h.remove}}" aria-label="{{h.removeLabel}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{noHist}}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding:24px 16px;text-align:center">
<div style="font-size:17px;font-weight:700">No searches yet</div>
<div class="mini" style="margin-top:6px">Models you open will show up here so you can get back to them fast.</div>
<button type="button" class="btn" style="margin-top:16px" onClick="{{toHomeSearch}}">Search models</button>
</div>
</sc-if>
</div>
</div>
</sc-if>

<!-- ============ SETTINGS ============ -->
<sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:16px;background:#fff;border-bottom:1px solid #E5EAF1;flex:none"><h1 style="margin:0;font-size:22px;font-weight:700">Settings</h1></div>
<div style="flex:1;min-height:0;overflow-y:auto;padding-bottom:20px">
<div class="lab">Application</div>
<div class="card" style="margin:0 16px;padding:4px 14px">
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #E5EAF1;font-size:14px"><span>App version</span><span style="color:#5B6778">0.1.0 (build 1), prototype</span></div>
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #E5EAF1;font-size:14px"><span>Dataset version</span><span style="color:#5B6778">{{dsVer}}</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px"><span>Last update</span><span style="color:#5B6778;text-align:right">{{dsWhen}}</span></div>
</div>
<div class="mini" style="margin:8px 16px 0">All records come from a supplied source list and are shown as Unverified until they are independently reviewed.</div>

<div class="lab">Data and connectivity</div>
<div class="card" style="margin:0 16px;overflow:hidden">
<button type="button" class="row" onClick="{{toUpdate}}"><span style="flex:1">Check for dataset updates</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<div class="row" style="cursor:default"><span style="flex:1"><span style="display:block">Simulate offline</span><span class="mini" style="display:block">Prototype only. Search keeps working offline.</span></span>
<button type="button" class="sw" role="switch" aria-checked="{{offline}}" aria-label="Simulate offline mode" onClick="{{toggleOffline}}" style="background:{{swBg}}"><i style="left:{{swLeft}}"></i></button></div>
</div>

<div class="lab">Preferences</div>
<div class="card" style="margin:0 16px;overflow:hidden">
<div class="row" style="cursor:default"><span style="flex:1">Theme</span><span style="color:#5B6778;font-size:14px">Light</span></div>
<button type="button" class="row" onClick="{{askClear}}"><span style="flex:1;color:#B42318;font-weight:600">Clear search history</span></button>
</div>

<div class="lab">Support</div>
<div class="card" style="margin:0 16px;overflow:hidden">
<button type="button" class="row" onClick="{{toHelp}}"><span style="flex:1">Help and FAQ</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
<button type="button" class="row" onClick="{{reportFromSettings}}"><span style="flex:1">Report an issue</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6778" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>

<div class="lab">Legal</div>
<div class="card" style="margin:0 16px;overflow:hidden">
<button type="button" class="row" onClick="{{legalToast}}"><span style="flex:1">Privacy policy</span></button>
<button type="button" class="row" onClick="{{legalToast}}"><span style="flex:1">Open-source acknowledgements</span></button>
</div>
<div class="mini" style="margin:12px 16px 0">Optional accounts and cross-device sync are planned for a later version. Search never needs an account.</div>
</div>
</div>
</sc-if>

<!-- ============ UPDATE ============ -->
<sc-if value="{{isUpdate}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:8px 8px 10px;background:#fff;border-bottom:1px solid #E5EAF1;display:flex;align-items:center;gap:4px;flex:none">
<button type="button" class="ib" onClick="{{goBack}}" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex:1;font-size:18px;font-weight:700">Dataset updates</div>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px">
<div class="card" style="padding:14px">
<div style="display:flex;justify-content:space-between;font-size:14px;padding-bottom:8px;border-bottom:1px solid #E5EAF1"><span>Current dataset</span><span style="font-weight:600">{{dsVer}}</span></div>
<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-top:8px"><span>Last update</span><span style="color:#5B6778;text-align:right">{{dsWhen}}</span></div>
</div>

<div class="card" style="padding:16px;margin-top:12px">
<sc-if value="{{ui.idle}}" hint-placeholder-val="{{ true }}">
<div>
<div style="font-size:16px;font-weight:700">Check for new data</div>
<div class="mini" style="margin-top:4px">Search keeps working offline. Updates only add or correct records.</div>
<button type="button" class="btn" style="width:100%;margin-top:14px" onClick="{{checkUpdates}}">Check for updates</button>
</div>
</sc-if>
<sc-if value="{{ui.checking}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px"><span class="spin"></span><div><div style="font-size:16px;font-weight:700">Checking for updates</div><div class="mini">You can keep using the app.</div></div></div>
</sc-if>
<sc-if value="{{ui.available}}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:16px;font-weight:700">A new compatibility dataset is available.</div>
<div class="mini" style="margin-top:4px">New version: v2 (prototype). Your current data stays in use until the new set is checked.</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
<button type="button" class="btn" onClick="{{downloadUpdate}}">Download update</button>
<button type="button" class="btn sec" onClick="{{resetUpd}}">Not now</button>
</div>
</div>
</sc-if>
<sc-if value="{{ui.downloading}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px"><span class="spin"></span><div><div style="font-size:16px;font-weight:700">Downloading</div><div class="mini">Progress isn't available for this download. You can leave this screen.</div></div></div>
</sc-if>
<sc-if value="{{ui.validating}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:12px"><span class="spin"></span><div><div style="font-size:16px;font-weight:700">Validating new data</div><div class="mini">Your existing dataset isn't replaced until this passes.</div></div></div>
</sc-if>
<sc-if value="{{ui.success}}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:16px;font-weight:700;color:#14612F">Update complete.</div>
<div class="mini" style="margin-top:4px">Now using dataset v2 (prototype).</div>
<button type="button" class="btn" style="width:100%;margin-top:14px" onClick="{{resetUpd}}">Done</button>
</div>
</sc-if>
<sc-if value="{{ui.uptodate}}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:16px;font-weight:700">Your compatibility data is up to date.</div>
<button type="button" class="btn sec" style="width:100%;margin-top:14px" onClick="{{resetUpd}}">OK</button>
</div>
</sc-if>
<sc-if value="{{ui.offline}}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:16px;font-weight:700">You are offline. You can continue using your downloaded data.</div>
<button type="button" class="btn" style="width:100%;margin-top:14px" onClick="{{checkUpdates}}">Try again</button>
</div>
</sc-if>
<sc-if value="{{ui.failed}}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:16px;font-weight:700;color:#B42318">Update failed. Your existing data is still available.</div>
<button type="button" class="btn" style="width:100%;margin-top:14px" onClick="{{checkUpdates}}">Retry</button>
</div>
</sc-if>
<sc-if value="{{ui.invalid}}" hint-placeholder-val="{{ false }}">
<div>
<div style="font-size:16px;font-weight:700;color:#B42318">The new dataset didn't pass validation.</div>
<div class="mini" style="margin-top:4px">It was discarded. Your existing data is still in use.</div>
<button type="button" class="btn" style="width:100%;margin-top:14px" onClick="{{checkUpdates}}">Retry</button>
</div>
</sc-if>
</div>

<div style="margin-top:14px;border:1.5px dashed #B8C4D4;border-radius:14px;padding:12px">
<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#5B6778">PROTOTYPE ONLY · NEXT CHECK SHOULD…</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
<sc-for list="{{scenarios}}" as="sc" hint-placeholder-count="4">
<button type="button" onClick="{{sc.pick}}" aria-pressed="{{sc.sel}}" style="min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid {{sc.border}};background:{{sc.bg}};font-size:13px;font-weight:600;color:{{sc.color}}">{{sc.label}}</button>
</sc-for>
</div>
<div class="mini" style="margin-top:8px">No live service is contacted. These are simulated results.</div>
</div>
</div>
</div>
</sc-if>

<!-- ============ HELP ============ -->
<sc-if value="{{isHelp}}" hint-placeholder-val="{{ false }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column">
<div style="padding:8px 8px 10px;background:#fff;border-bottom:1px solid #E5EAF1;display:flex;align-items:center;gap:4px;flex:none">
<button type="button" class="ib" onClick="{{goBack}}" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex:1;font-size:18px;font-weight:700">Help and FAQ</div>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px">
<div class="card" style="overflow:hidden">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="4">
<div style="border-bottom:1px solid #E5EAF1">
<button type="button" class="row" style="border-bottom:0;min-height:56px" onClick="{{f.toggle}}" aria-expanded="{{f.open}}"><span style="flex:1;font-weight:600">{{f.q}}</span><span style="font-size:20px;color:#5B6778;width:20px;text-align:center">{{f.sign}}</span></button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{ false }}"><div style="padding:0 16px 14px;font-size:14px;line-height:1.5;color:#334155;background:#fff">{{f.a}}</div></sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<!-- ============ BOTTOM NAV ============ -->
<sc-if value="{{showNav}}" hint-placeholder-val="{{ true }}">
<div style="flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border-top:1px solid #D9E0EA;padding:6px 6px 10px;gap:4px">
<button type="button" onClick="{{tabHome}}" aria-label="Home, search" aria-current="{{nav.home.cur}}" style="min-height:56px;border:0;border-radius:12px;background:{{nav.home.bg}};color:{{nav.home.color}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</button>
<button type="button" onClick="{{tabFavs}}" aria-label="Favorites" aria-current="{{nav.favs.cur}}" style="min-height:56px;border:0;border-radius:12px;background:{{nav.favs.bg}};color:{{nav.favs.color}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.5 6.6 20.4l1-6.1L3.2 10l6.1-.9z"></path></svg>Favorites</button>
<button type="button" onClick="{{tabHist}}" aria-label="Search history" aria-current="{{nav.hist.cur}}" style="min-height:56px;border:0;border-radius:12px;background:{{nav.hist.bg}};color:{{nav.hist.color}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600">

<!-- ============ SHEETS ============ -->
<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;flex-direction:column;justify-content:flex-end">
<button type="button" onClick="{{closeSheet}}" aria-label="Dismiss" style="flex:1;border:0;background:transparent;min-height:40px"></button>

<sc-if value="{{sheetReport}}" hint-placeholder-val="{{ false }}">
<div style="background:#fff;border-radius:20px 20px 0 0;max-height:720px;overflow-y:auto;padding:8px 16px 20px">
<div style="width:40px;height:4px;border-radius:2px;background:#CBD5E1;margin:4px auto 10px"></div>

<sc-if value="{{rIsSuccess}}" hint-placeholder-val="{{ false }}">
<div style="padding:8px 0 4px">
<div style="font-size:18px;font-weight:700;color:#14612F">Report received (prototype)</div>
<div class="mini" style="margin-top:6px">Nothing was sent. In the live app, an administrator reviews every report before any compatibility data changes. A report is not an instant correction.</div>
<button type="button" class="btn" style="width:100%;margin-top:16px" onClick="{{doneReport}}">Done</button>
</div>
</sc-if>

<sc-if value="{{rShowForm}}" hint-placeholder-val="{{ true }}">
<div>
<div style="display:flex;align-items:center;justify-content:space-between">
<h2 style="margin:0;font-size:18px;font-weight:700">Report an issue</h2>
<button type="button" class="ib" onClick="{{closeSheet}}" aria-label="Close report form"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="mini" style="margin-bottom:10px">Prototype: submitting does not contact a live service. Real reports need an internet connection.</div>

<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<div style="background:#EDF1F6;border:1px solid #B8C4D4;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;color:#2B3748;margin-bottom:10px">You are offline. Reporting needs an internet connection. Your text is kept here.</div>
</sc-if>
<sc-if value="{{rIsError}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="background:#FDECEA;border:1px solid #F1A9A2;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;color:#8E1B12;margin-bottom:10px">Couldn't submit. Check your connection and retry. Your text is kept.</div>
</sc-if>

<div style="font-size:13px;font-weight:600;color:#334155;margin-bottom:6px">Issue type (required)</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{rTypes}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.sel}}" style="min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid {{t.border}};background:{{t.bg}};font-size:13px;font-weight:600;color:{{t.color}};text-align:left">{{t.label}}</button>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px">
<div style="background:#F4F6F9;border-radius:10px;padding:8px 10px"><div style="font-size:11px;color:#5B6778;font-weight:600">PHONE MODEL</div><div style="font-size:13px;font-weight:600;overflow-wrap:anywhere">{{rModel}}</div></div>
<div style="background:#F4F6F9;border-radius:10px;padding:8px 10px"><div style="font-size:11px;color:#5B6778;font-weight:600">GROUP</div><div style="font-size:13px;font-weight:600;overflow-wrap:anywhere">{{rGroup}}</div></div>
</div>

<label for="affected" style="display:block;font-size:13px;font-weight:600;color:#334155;margin:12px 0 6px">Affected model (optional)</label>
<input id="affected" class="fld" type="text" value="{{rAffected}}" onChange="{{onAffected}}" placeholder="Model name">

<label for="desc" style="display:block;font-size:13px;font-weight:600;color:#334155;margin:12px 0 6px">What is wrong? (required)</label>
<textarea id="desc" class="fld" rows="4" value="{{rText}}" onChange="{{onDesc}}" placeholder="Describe the issue, at least 10 characters" style="resize:none;border-color:{{rDescBorder}}"></textarea>
<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:12px">
<span style="color:#B42318;font-weight:600">{{rDescError}}</span>
<span style="color:#5B6778">{{rCount}}/500</span>
</div>

<button type="button" class="btn" style="width:100%;margin-top:12px" disabled="{{rDisabled}}" onClick="{{submitReport}}">{{rBtnLabel}}</button>
<label style="display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:#5B6778;min-height:32px"><input type="checkbox" checked="{{rSimFail}}" onChange="{{toggleSimFail}}" style="width:18px;height:18px">Prototype: simulate a network error on submit</label>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{sheetClear}}" hint-placeholder-val="{{ false }}">
<div style="background:#fff;border-radius:20px 20px 0 0;padding:12px 16px 24px">
<div style="width:40px;height:4px;border-radius:2px;background:#CBD5E1;margin:0 auto 12px"></div>
<h2 style="margin:0;font-size:18px;font-weight:700">Clear all search history?</h2>
<div class="mini" style="margin-top:6px">This removes {{histCount}} saved searches from this device. Favorites and compatibility data are not affected.</div>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
<button type="button" class="btn dng" onClick="{{confirmClear}}">Clear history</button>
<button type="button" class="btn sec" onClick="{{closeSheet}}">Cancel</button>
</div>
</div>
</sc-if>
</div>
</sc-if>

<!-- ============ TOAST ============ -->
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="position:absolute;left:16px;right:16px;bottom:{{toastBottom}}px;background:#0F172A;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;text-align:center;box-shadow:0 6px 20px rgba(15,23,42,.3)">{{toast}}</div>
</sc-if>

</div>
</sc-if>
</div>
</template>
